version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== AI Dialer Production Build ==="
        - pwd
        - ls -la
        - echo "=== Checking amplify_ui directory ==="
        - ls -la amplify_ui/
        - echo "=== Setting Production Environment ==="
        - export NODE_ENV=production
        - export REACT_APP_ENVIRONMENT=production
        - export REACT_APP_BACKEND_API_URL=https://intelareach.com
        - export REACT_APP_WS_URL=wss://intelareach.com/ws/dashboard
        - export REACT_APP_DEBUG_MODE=false
        - export GENERATE_SOURCEMAP=false
        - export REACT_APP_USE_MOCK_DATA=false
        - echo "=== Installing dependencies ==="
        - npm ci --prefix amplify_ui
    build:
      commands:
        - echo "=== Building production app ==="
        - npm run build --prefix amplify_ui
        - echo "=== Build Complete - Production Ready ==="
        - ls -la amplify_ui/build/
  artifacts:
    baseDirectory: amplify_ui/build
    files:
      - '**/*'
  cache:
    paths:
      - amplify_ui/node_modules/**/* 