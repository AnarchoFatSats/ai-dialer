version: 0.2

phases:
  install:
    commands:
      - apt-get update && apt-get install -y unzip curl python3
  pre_build:
    commands:
      - aws --version
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 337909762852.dkr.ecr.us-east-1.amazonaws.com
      - |
        python3 - <<'PY'
        import os, shutil
        # Normalize any Windows-style backslash filenames to proper POSIX paths
        for name in os.listdir('.'):
            if '\\' in name:
                dest = name.replace('\\', '/')
                parent = os.path.dirname(dest)
                if parent and not os.path.exists(parent):
                    os.makedirs(parent, exist_ok=True)
                shutil.move(name, dest)
        PY
  build:
    commands:
      - export DOCKER_BUILDKIT=1
      - docker buildx version || true
      - docker build --progress=plain -t 337909762852.dkr.ecr.us-east-1.amazonaws.com/ai-dialer:latest . || (echo "Docker build failed" && exit 1)
      - docker push 337909762852.dkr.ecr.us-east-1.amazonaws.com/ai-dialer:latest

artifacts:
  files:
    - '**/*'